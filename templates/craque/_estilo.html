<style>
/* ===== Vida de Craque ===== */
.vc-hero { background: radial-gradient(circle at 85% 20%, rgba(250,204,21,.32), transparent 45%), linear-gradient(135deg,#111827,#7c2d12 60%,#c2410c); }
.vc-hero h1 .ouro { color:#fde68a; }
.vc-grid { display:grid; grid-template-columns:300px 1fr; gap:16px; margin:16px 0 30px; align-items:start; }
@media (max-width:860px){ .vc-grid { grid-template-columns:1fr; } }

/* carta do jogador */
.vc-carta { --cor:#16a34a; position:relative; border-radius:22px; padding:16px; color:#1a1200; overflow:hidden;
  background: linear-gradient(160deg,#fef3c7,#fcd34d 45%,#d97706); box-shadow:0 16px 34px rgba(0,0,0,.28); }
.vc-carta::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(115deg, rgba(255,255,255,.18) 0 2px, transparent 2px 14px); pointer-events:none; }
.vc-carta > * { position:relative; }
.vc-topo { display:flex; align-items:center; gap:12px; }
.vc-ovr { font-family:var(--fonte-titulo); font-size:3.2rem; font-weight:800; line-height:.9; }
.vc-ovr small { display:block; font-size:.95rem; letter-spacing:1px; }
.vc-camisa { width:84px; height:84px; margin-left:auto; border-radius:18px; background:var(--cor); color:#fff; display:flex; align-items:center; justify-content:center;
  font-family:var(--fonte-titulo); font-size:2.6rem; font-weight:800; box-shadow:inset 0 -6px 0 rgba(0,0,0,.18); text-shadow:0 2px 0 rgba(0,0,0,.25); }
.vc-nome { font-family:var(--fonte-titulo); text-transform:uppercase; letter-spacing:1px; font-size:1.7rem; line-height:1; margin:10px 0 2px; }
.vc-sub { font-family:var(--fonte-mono); font-size:.75rem; }
.vc-barras { margin-top:10px; }
.vc-barra { display:grid; grid-template-columns:72px 1fr 30px; align-items:center; gap:6px; font-size:.78rem; font-weight:600; margin-bottom:5px; }
.vc-barra i { display:block; height:8px; border-radius:99px; background:rgba(0,0,0,.15); overflow:hidden; }
.vc-barra i b { display:block; height:100%; background:#1a1200; border-radius:99px; transition:width .6s ease; }
.vc-barra span:last-child { font-family:var(--fonte-mono); text-align:right; }
.vc-medidores { background:#0f172a; color:#e2e8f0; border-radius:18px; padding:12px 14px; margin-top:12px; }
.vc-medidores .vc-barra i { background:rgba(255,255,255,.1); }
.vc-medidores .vc-barra i b { background:linear-gradient(90deg,#f59e0b,#facc15); }
.vc-medidores .vc-barra i b.baixo { background:linear-gradient(90deg,#dc2626,#f97316); }
.vc-temp { background:#0f172a; color:#e2e8f0; border-radius:18px; padding:12px 14px; margin-top:12px; font-size:.85rem; }
.vc-temp .num { font-family:var(--fonte-titulo); font-size:1.5rem; color:#facc15; line-height:1; }
.vc-temp .grade { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; text-align:center; }
.vc-temp .grade small { color:#94a3b8; font-family:var(--fonte-mono); font-size:.65rem; text-transform:uppercase; }

/* palco principal */
.vc-palco { background:linear-gradient(165deg,#0b1220,#111827 60%,#1c1917); color:#f1f5f9; border-radius:22px; padding:18px; box-shadow:0 14px 30px rgba(0,0,0,.25); min-height:260px; }
.vc-etiqueta { display:inline-flex; align-items:center; gap:7px; font-family:var(--fonte-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.8px;
  padding:4px 10px; border-radius:999px; background:rgba(250,204,21,.15); color:#fde68a; border:1px solid rgba(250,204,21,.35); }
.vc-etiqueta.ia { background:rgba(124,58,237,.2); color:#ddd6fe; border-color:rgba(167,139,250,.45); }
.vc-texto { font-size:1.08rem; line-height:1.5; margin:12px 0 16px; }
.vc-opcoes { display:grid; gap:10px; }
.vc-opcao { text-align:left; border:2px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:#f8fafc; border-radius:16px; padding:12px 14px; font-weight:600;
  display:flex; align-items:center; gap:10px; transition:transform .12s, border-color .12s, background .12s; }
.vc-opcao:hover { transform:translateX(4px); border-color:#facc15; background:rgba(250,204,21,.1); }
.vc-opcao .n { width:28px; height:28px; flex:none; border-radius:50%; background:#facc15; color:#1a1200; font-family:var(--fonte-titulo); display:flex; align-items:center; justify-content:center; }
.vc-opcao[disabled] { opacity:.5; transform:none; }

/* jogo rolando */
.vc-rolando { text-align:center; padding:30px 10px; }
.vc-bola { font-size:3rem; display:inline-block; animation:vcQuica .6s infinite alternate ease-in; }
@keyframes vcQuica { from { transform:translateY(0) rotate(0); } to { transform:translateY(-22px) rotate(180deg); } }
.vc-relogio { font-family:var(--fonte-mono); font-size:1.4rem; color:#facc15; margin-top:8px; }

/* placar do jogo */
.vc-placar { display:flex; align-items:center; justify-content:center; gap:12px; background:rgba(0,0,0,.35); border-radius:16px; padding:12px; margin:10px 0;
  font-family:var(--fonte-titulo); text-transform:uppercase; font-size:clamp(1.1rem,4vw,1.6rem); letter-spacing:.5px; text-align:center; }
.vc-placar .g { font-size:2.2rem; color:#facc15; }
.vc-resultado.V { color:#4ade80; } .vc-resultado.E { color:#fde68a; } .vc-resultado.D { color:#f87171; }
.vc-cursor::after { content:"▌"; animation:vcPisca .8s infinite; color:#facc15; }
@keyframes vcPisca { 50% { opacity:0; } }
.vc-mudou { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.vc-mudou span { font-family:var(--fonte-mono); font-size:.72rem; padding:2px 9px; border-radius:999px; background:rgba(255,255,255,.08); }
.vc-mudou span.mais { color:#4ade80; } .vc-mudou span.menos { color:#f87171; }

/* coletiva */
.vc-coletiva { position:relative; }
.vc-microfones { font-size:1.6rem; color:#94a3b8; letter-spacing:6px; }
.vc-jornalista { display:flex; align-items:center; gap:10px; margin:10px 0; }
.vc-jornalista .av { width:44px; height:44px; border-radius:50%; background:#334155; display:flex; align-items:center; justify-content:center; color:#facc15; font-size:1.2rem; }
.vc-pergunta { background:#1e293b; border-radius:16px 16px 16px 4px; padding:12px 14px; font-size:1.02rem; line-height:1.45; }
.vc-coletiva textarea { width:100%; min-height:90px; border-radius:14px; border:2px solid rgba(255,255,255,.15); background:rgba(255,255,255,.05); color:#fff; padding:10px 12px; margin-top:12px; resize:vertical; }
.vc-coletiva textarea:focus { outline:none; border-color:#facc15; }
.vc-btn { border:0; border-radius:12px; padding:10px 16px; font-family:var(--fonte-titulo); font-weight:700; letter-spacing:1px; text-transform:uppercase; background:linear-gradient(180deg,#fde68a,#f59e0b); color:#1a1200; }
.vc-btn.sec { background:rgba(255,255,255,.1); color:#f1f5f9; }
.vc-btn[disabled] { opacity:.5; }
.vc-prontas { display:grid; gap:8px; margin-top:10px; }
.vc-prontas button { text-align:left; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.04); color:#e2e8f0; border-radius:12px; padding:9px 12px; font-size:.9rem; }
.vc-prontas button:hover { border-color:#facc15; }

/* fim de temporada */
.vc-resumo { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; text-align:center; margin:12px 0; }
.vc-resumo div { background:rgba(255,255,255,.06); border-radius:12px; padding:8px; }
.vc-resumo b { display:block; font-family:var(--fonte-titulo); font-size:1.6rem; color:#facc15; }
.vc-resumo small { font-family:var(--fonte-mono); font-size:.65rem; color:#94a3b8; text-transform:uppercase; }
.vc-propostas { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:10px; }
.vc-proposta { --cor:#334155; border:0; border-radius:16px; padding:14px; color:#fff; text-align:left; font-family:var(--fonte-titulo); text-transform:uppercase; font-size:1.2rem;
  background:linear-gradient(160deg, color-mix(in srgb, var(--cor) 85%, #000), color-mix(in srgb, var(--cor) 45%, #000)); box-shadow:0 8px 18px rgba(0,0,0,.25); }
.vc-proposta small { display:block; font-family:var(--fonte-mono); font-size:.66rem; opacity:.85; text-transform:none; }
.vc-premios { display:flex; flex-wrap:wrap; gap:8px; }
.vc-premios span { background:rgba(250,204,21,.18); color:#fde68a; border-radius:999px; padding:4px 12px; font-size:.85rem; }

/* linha do tempo (jornal) */
.vc-jornal { margin-top:16px; }
.vc-materia { background:#fffdf7; color:#1c1917; border-radius:16px; padding:12px 14px; margin-bottom:10px; border-left:5px solid #c2410c; box-shadow:0 4px 12px rgba(0,0,0,.06); }
.vc-materia.decisao { border-left-color:#7c3aed; } .vc-materia.coletiva { border-left-color:#0e7490; } .vc-materia.temporada { border-left-color:#ca8a04; background:#fefce8; } .vc-materia.marco { border-left-color:#16a34a; }
.vc-materia .tipo { font-family:var(--fonte-mono); font-size:.66rem; text-transform:uppercase; letter-spacing:.8px; color:#78716c; }
.vc-materia h4 { font-family:Georgia, 'Times New Roman', serif; font-weight:700; font-size:1.12rem; margin:2px 0 4px; }
.vc-materia p { margin:0; font-size:.92rem; color:#44403c; }
.vc-materia .vc-mudou span { background:#f5f5f4; }
.vc-materia .vc-mudou span.mais { color:#15803d; } .vc-materia .vc-mudou span.menos { color:#b91c1c; }
.vc-voz { border:1px solid rgba(255,255,255,.25); background:rgba(0,0,0,.25); color:#e2e8f0; border-radius:999px; padding:4px 11px; font-size:.75rem; font-family:var(--fonte-mono); }
.vc-voz.ligada { background:#7c3aed; border-color:#a78bfa; color:#fff; }

/* criação */
.vc-form { background:#0f172a; color:#e2e8f0; border-radius:22px; padding:18px; }
.vc-form label { font-family:var(--fonte-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.6px; color:#94a3b8; margin-bottom:4px; }
.vc-form input, .vc-form select { width:100%; border-radius:12px; border:2px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); color:#fff; padding:9px 12px; }
.vc-form select option { color:#111; }
.vc-clubes { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
.vc-clube { position:relative; cursor:pointer; border-radius:12px; padding:9px 10px; background:rgba(255,255,255,.05); border:2px solid transparent; font-weight:600; font-size:.88rem; margin:0; }
.vc-clube input { position:absolute; opacity:0; pointer-events:none; }
.vc-clube .faixa { display:block; height:5px; border-radius:99px; background:var(--cor); margin-bottom:6px; }
.vc-clube small { display:block; font-family:var(--fonte-mono); font-size:.65rem; color:#94a3b8; font-weight:400; }
.vc-clube:has(input:checked) { border-color:#facc15; background:rgba(250,204,21,.12); }
</style>
