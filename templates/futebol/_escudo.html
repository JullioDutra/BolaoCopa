{% if time.escudo_src %}<img src="{{ time.escudo_src }}" alt="{{ time.nome }}" class="fb-escudo" style="width:{{ tam|default:40 }}px;height:{{ tam|default:40 }}px;" loading="lazy">{% else %}<span class="fb-escudo-fallback" style="width:{{ tam|default:40 }}px;height:{{ tam|default:40 }}px;background:{{ time.cor_hex }};font-size:calc({{ tam|default:40 }}px * .5);">{{ time.nome|slice:":1" }}</span>{% endif %}
