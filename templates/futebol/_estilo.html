<style>
    .fb-hero { background: repeating-linear-gradient(90deg, #1b6b2a 0 60px, #1f7a30 60px 120px); border-radius: 22px; color:#fff; position:relative; overflow:hidden; padding: 28px 24px; }

    .fb-hero::after { content:""; position:absolute; left:50%; top:14px; bottom:14px; border-left: 2px solid rgba(255,255,255,.28); pointer-events:none; }
    .fb-hero > * { position:relative; z-index:1; }

    /* Campo de futebol (11 eleito / escalação) */
    .campo { background: repeating-linear-gradient(0deg, #1b6b2a 0 56px, #1f7a30 56px 112px); border-radius: 18px; padding: 18px 8px; position:relative; border: 3px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
    .campo::before { content:""; position:absolute; left:8%; right:8%; top:50%; border-top: 2px solid rgba(255,255,255,.55); }
    .campo::after { content:""; position:absolute; left:50%; top:50%; width:90px; height:90px; margin:-45px 0 0 -45px; border: 2px solid rgba(255,255,255,.55); border-radius:50%; }
