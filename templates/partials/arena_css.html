<style>
/* ===== Arena: visual de jogo compartilhado (X1, rankings, súmula, 7 a 0) ===== */
.ar-hero { position:relative; overflow:hidden; border-radius:22px; padding:28px 24px; color:#fff; margin:18px 0 26px;
  background: radial-gradient(circle at 85% 20%, rgba(255,214,10,.22), transparent 45%), linear-gradient(135deg,#052e1a,#0b5d36 60%,#0e7a45);
  box-shadow:0 14px 34px rgba(5,46,26,.35); }
.ar-hero::before { content:""; position:absolute; inset:0; opacity:.12; pointer-events:none;
  background: repeating-linear-gradient(90deg, transparent 0 58px, rgba(255,255,255,.9) 58px 60px); }
.ar-hero::after { content:""; position:absolute; width:260px; height:260px; border:3px solid rgba(255,255,255,.14); border-radius:50%; right:-70px; bottom:-120px; }
.ar-hero > * { position:relative; z-index:1; }
.ar-hero h1 { font-family:var(--fonte-titulo); font-weight:700; text-transform:uppercase; letter-spacing:1px; font-size:clamp(1.9rem,5vw,2.8rem); margin:0; line-height:1; }
.ar-hero p { margin:.4rem 0 0; opacity:.85; }
.ar-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
.ar-chip { display:inline-flex; align-items:center; gap:7px; padding:6px 14px; border-radius:999px; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.18); font-family:var(--fonte-mono); font-size:.78rem; }
.ar-chip i { color:#ffd60a; }

.ar-secao { font-family:var(--fonte-titulo); text-transform:uppercase; letter-spacing:1.5px; font-size:1.25rem; margin:8px 0 14px; display:flex; align-items:center; gap:10px; }
.ar-secao::after { content:""; flex:1; height:2px; background:linear-gradient(90deg, rgba(0,0,0,.18), transparent); }

.ar-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:18px; }
.ar-card { --cor:#16a34a; position:relative; display:flex; flex-direction:column; border-radius:20px; padding:22px 20px 18px; color:#fff; overflow:hidden;
  background: linear-gradient(160deg, color-mix(in srgb, var(--cor) 92%, #000), color-mix(in srgb, var(--cor) 55%, #000));
  box-shadow:0 10px 24px rgba(0,0,0,.18); transition:transform .18s ease, box-shadow .18s ease; }
.ar-card:hover { transform:translateY(-5px) rotate(-.4deg); box-shadow:0 18px 34px rgba(0,0,0,.28); }
.ar-card::before { content:""; position:absolute; right:-40px; top:-40px; width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,.10); }
.ar-card .ar-ico { width:58px; height:58px; border-radius:16px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.18); font-size:1.7rem; margin-bottom:14px; }
.ar-card h3 { font-family:var(--fonte-titulo); text-transform:uppercase; letter-spacing:.8px; font-size:1.5rem; margin:0 0 6px; line-height:1.05; }
.ar-card p { font-size:.88rem; opacity:.9; flex:1; margin:0 0 16px; }
.ar-tag { position:absolute; top:16px; right:16px; font-family:var(--fonte-mono); font-size:.68rem; letter-spacing:.5px; background:rgba(0,0,0,.35); border-radius:999px; padding:3px 10px; }
.ar-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:0; border-radius:12px; padding:11px 14px; font-family:var(--fonte-titulo); font-weight:700; font-size:1.05rem; letter-spacing:1px; text-transform:uppercase; text-decoration:none; background:#fff; color:#111; transition:filter .15s; }
.ar-btn:hover { filter:brightness(.94); color:#111; }
.ar-btn.sec { background:rgba(0,0,0,.28); color:#fff; margin-top:8px; }
.ar-btn.sec:hover { color:#fff; background:rgba(0,0,0,.4); }
.ar-card .ar-rei { background:rgba(0,0,0,.3); border-radius:12px; padding:8px 12px; margin-bottom:14px; font-size:.85rem; display:flex; align-items:center; justify-content:space-between; gap:8px; }

/* Pódio e tabela de classificação */
.ar-podio { display:grid; grid-template-columns:1fr 1.15fr 1fr; align-items:end; gap:10px; max-width:640px; margin:0 auto 22px; }
.ar-pod { text-align:center; color:#fff; border-radius:16px 16px 0 0; padding:14px 8px 12px; background:linear-gradient(180deg,#334155,#0f172a); }
.ar-pod.p1 { background:linear-gradient(180deg,#d4af37,#7a5c00); min-height:170px; }
.ar-pod.p2 { background:linear-gradient(180deg,#9ca3af,#374151); min-height:140px; }
.ar-pod.p3 { background:linear-gradient(180deg,#cd7f32,#6b3f12); min-height:120px; }
.ar-pod .medalha { font-size:1.8rem; }
.ar-pod .nome { font-family:var(--fonte-titulo); font-size:1.2rem; text-transform:uppercase; word-break:break-word; line-height:1.1; }
.ar-pod .valor { font-family:var(--fonte-mono); font-size:.9rem; opacity:.9; }
.ar-tabela { background:#0f172a; border-radius:18px; overflow:hidden; box-shadow:0 10px 26px rgba(0,0,0,.25); }
.ar-linha { display:grid; grid-template-columns:48px 1fr auto; align-items:center; gap:10px; padding:11px 16px; color:#e2e8f0; border-bottom:1px solid rgba(255,255,255,.06); }
.ar-linha:last-child { border-bottom:0; }
.ar-linha .pos { font-family:var(--fonte-mono); color:#94a3b8; text-align:center; }
.ar-linha .nome { font-weight:600; }
.ar-linha .sub { font-size:.75rem; color:#94a3b8; font-family:var(--fonte-mono); }
.ar-linha .pts { font-family:var(--fonte-titulo); font-size:1.35rem; color:#ffd60a; }
.ar-linha.eu { background:rgba(255,214,10,.12); }
.ar-vazio { text-align:center; color:#94a3b8; padding:34px 16px; }
@media (max-width:576px){ .ar-hero{padding:22px 16px;border-radius:18px;} .ar-podio{gap:6px;} .ar-pod .nome{font-size:1rem;} }
/* Avatares de perfil (ícones) */
.av-ico { display:inline-flex; align-items:center; justify-content:center; border-radius:50%; color:#fff; flex:none; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.18); border:2px solid rgba(255,255,255,.6); vertical-align:middle; }
a.nome-jogador { color:inherit; text-decoration:none; } a.nome-jogador:hover { text-decoration:underline; }
</style>
