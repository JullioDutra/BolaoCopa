<style>
.sz-hero { background: radial-gradient(circle at 90% 10%, rgba(255,214,10,.3), transparent 45%), linear-gradient(135deg,#0b1f3a,#14532d 70%,#16a34a); }

/* painel lateral */
.sz-painel { background:#fff; border-radius:18px; box-shadow:0 4px 14px rgba(0,0,0,.07); padding:14px; }

.sz-banco { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }

.sz-banco button.alvo { border-color:#16a34a; background:#ecfdf5; }

.sz-posse { display:flex; height:10px; border-radius:99px; overflow:hidden; margin:6px 0 12px; } .sz-posse span { display:block; transition:width .5s; }

<style>

.sz-numeros div { background:rgba(255,255,255,.08); border-radius:12px; padding:8px 2px; } .sz-numeros b { display:block; font-family:var(--fonte-titulo); font-size:1.6rem; line-height:1; } .sz-numeros small { font-size:.6rem; opacity:.7; text-transform:uppercase; font-family:var(--fonte-mono); }
