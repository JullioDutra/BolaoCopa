<style>
.sz-hero { background: radial-gradient(circle at 90% 10%, rgba(255,214,10,.3), transparent 45%), linear-gradient(135deg,#0b1f3a,#14532d 70%,#16a34a); }
.sz-hero h1 .sete { color:#ffd60a; font-size:1.15em; }
.sz-modo { --cor:#16a34a; }
.sz-time { position:relative; cursor:pointer; border-radius:16px; background:#fff; border:3px solid transparent; box-shadow:0 4px 14px rgba(0,0,0,.08); padding:12px; transition:transform .12s, border-color .12s; display:block; height:100%; margin:0; }
.sz-time:hover { transform:translateY(-3px); }
.sz-time input { position:absolute; opacity:0; pointer-events:none; }
.sz-time:has(input:checked) { border-color:var(--cor-time,#16a34a); box-shadow:0 8px 24px rgba(0,0,0,.18); }
.sz-time .faixa { height:6px; border-radius:99px; background:var(--cor-time,#16a34a); margin-bottom:10px; }
.sz-time .nome { font-family:var(--fonte-titulo); font-size:1.25rem; text-transform:uppercase; line-height:1.05; }
.sz-time .ano { font-family:var(--fonte-mono); font-size:.75rem; color:#6b7280; }
.sz-time .apelido { font-size:.75rem; color:#6b7280; min-height:2.1em; }
.sz-barra { display:flex; align-items:center; gap:6px; font-family:var(--fonte-mono); font-size:.65rem; color:#6b7280; margin-top:3px; }
.sz-barra i { flex:1; height:5px; border-radius:99px; background:#e5e7eb; overflow:hidden; display:block; }
.sz-barra i b { display:block; height:100%; background:var(--cor-time,#16a34a); }
.sz-escudo { width:46px; height:46px; object-fit:contain; flex:none; }
.sz-escudo-fb { width:46px; height:46px; border-radius:50%; flex:none; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-family:var(--fonte-titulo); font-size:1.3rem; }
.sz-opt { display:inline-flex; }
.sz-opt input { display:none; }
.sz-opt span { border:2px solid #d1d5db; border-radius:999px; padding:6px 14px; cursor:pointer; font-weight:600; background:#fff; }
.sz-opt input:checked + span { background:#0f172a; color:#fff; border-color:#0f172a; }

/* placar */
.sz-placar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; background:linear-gradient(135deg,#0b1f3a,#111827); color:#fff; border-radius:20px; padding:16px; box-shadow:0 12px 30px rgba(0,0,0,.3); }
.sz-lado { display:flex; align-items:center; gap:10px; min-width:0; }
.sz-lado.fora { flex-direction:row-reverse; text-align:right; }
.sz-lado .nome { font-family:var(--fonte-titulo); font-size:1.3rem; text-transform:uppercase; line-height:1; }
.sz-lado small { color:#94a3b8; font-family:var(--fonte-mono); }
.sz-centro { text-align:center; }
.sz-gols { font-family:var(--fonte-titulo); font-size:3.2rem; font-weight:700; line-height:1; letter-spacing:4px; }
.sz-relogio { font-family:var(--fonte-mono); background:#ef4444; border-radius:999px; padding:2px 12px; font-size:.85rem; display:inline-block; }
.sz-relogio.pausa { background:#f59e0b; } .sz-relogio.fim { background:#475569; }
@media(max-width:576px){ .sz-placar{grid-template-columns:1fr; text-align:center;} .sz-lado,.sz-lado.fora{justify-content:center;flex-direction:row;text-align:left;} .sz-gols{font-size:2.6rem;} }

/* feed */
.sz-feed { background:#0f172a; border-radius:18px; padding:8px; height:430px; overflow-y:auto; scroll-behavior:smooth; }
.sz-ev { display:grid; grid-template-columns:52px 28px 1fr; gap:8px; align-items:start; padding:8px 8px; border-radius:10px; color:#e2e8f0; animation:szIn .35s ease; }
.sz-ev .min { font-family:var(--fonte-mono); color:#94a3b8; font-size:.8rem; text-align:right; padding-top:2px; }
.sz-ev .ico { text-align:center; padding-top:2px; }
.sz-ev.gol { background:linear-gradient(90deg, rgba(34,197,94,.28), transparent); font-weight:700; }
.sz-ev.gol.eu { background:linear-gradient(90deg, rgba(250,204,21,.35), transparent); }
.sz-ev.vermelho { background:rgba(239,68,68,.18); } .sz-ev.penalti { background:rgba(245,158,11,.16); }
.sz-ev.intervalo, .sz-ev.fim { background:#1e293b; text-align:center; grid-template-columns:1fr; font-family:var(--fonte-titulo); text-transform:uppercase; letter-spacing:1px; }
.sz-ev.info { color:#94a3b8; font-style:italic; }
.sz-ev .placar-tag { font-family:var(--fonte-mono); background:#16a34a; color:#fff; border-radius:6px; padding:0 6px; margin-left:6px; font-size:.75rem; }
@keyframes szIn { from { opacity:0; transform:translateY(8px) scale(.98);} to { opacity:1; transform:none; } }
.sz-ctrl { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.sz-ctrl button { border:0; border-radius:12px; padding:9px 14px; font-family:var(--fonte-titulo); letter-spacing:.8px; text-transform:uppercase; font-size:1rem; background:#0f172a; color:#fff; }
.sz-ctrl button.principal { background:#16a34a; } .sz-ctrl button:disabled { opacity:.4; }

/* painel lateral */
.sz-painel { background:#fff; border-radius:18px; box-shadow:0 4px 14px rgba(0,0,0,.07); padding:14px; }
.sz-abas { display:flex; gap:6px; margin-bottom:12px; }
.sz-abas button { flex:1; border:0; border-radius:10px; padding:7px; background:#eef2ef; font-weight:700; font-size:.85rem; }
.sz-abas button.on { background:#0f172a; color:#fff; }
.sz-seg { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.sz-seg button { border:2px solid #e5e7eb; background:#fff; border-radius:12px; padding:8px 6px; font-weight:700; font-size:.85rem; }
.sz-seg button.on { border-color:#16a34a; background:#ecfdf5; color:#166534; }
.sz-campo { background:repeating-linear-gradient(0deg,#1b6b2a 0 44px,#1f7a30 44px 88px); border:3px solid #fff; border-radius:14px; padding:10px 4px; position:relative; }
.sz-campo::before { content:""; position:absolute; left:6%; right:6%; top:50%; border-top:2px solid rgba(255,255,255,.4); }
.sz-linha { display:flex; justify-content:space-around; margin:10px 0; position:relative; z-index:1; }
.sz-jog { width:72px; text-align:center; color:#fff; cursor:pointer; }
.sz-jog .bola { width:40px; height:40px; border-radius:50%; margin:0 auto 2px; display:flex; align-items:center; justify-content:center; background:#fff; color:#111; font-family:var(--fonte-titulo); font-weight:700; border:3px solid var(--aro,#fff); position:relative; box-shadow:0 3px 8px rgba(0,0,0,.35); }
.sz-jog.sel .bola { outline:3px solid #facc15; }
.sz-jog.fora-de-campo { opacity:.35; cursor:default; }
.sz-jog .n { font-size:.64rem; font-weight:700; line-height:1.05; text-shadow:0 1px 3px #000; }
.sz-jog .nt { font-family:var(--fonte-mono); font-size:.6rem; background:rgba(0,0,0,.5); border-radius:99px; padding:0 5px; }
.sz-jog .am { position:absolute; top:-4px; right:-4px; width:11px; height:15px; background:#facc15; border-radius:2px; }
.sz-banco { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.sz-banco button { border:2px solid #e5e7eb; background:#fff; border-radius:10px; padding:5px 9px; font-size:.78rem; font-weight:600; }
.sz-banco button.alvo { border-color:#16a34a; background:#ecfdf5; }
.sz-stat { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; font-size:.85rem; padding:5px 0; border-bottom:1px solid #f1f3f5; text-align:center; }
.sz-stat b:first-child { text-align:left; } .sz-stat b:last-child { text-align:right; }
.sz-posse { display:flex; height:10px; border-radius:99px; overflow:hidden; margin:6px 0 12px; } .sz-posse span { display:block; transition:width .5s; }
.sz-fim { background:linear-gradient(135deg,#0b1f3a,#14532d); color:#fff; border-radius:20px; padding:22px; text-align:center; margin-top:14px; box-shadow:0 12px 30px rgba(0,0,0,.3); animation:szIn .5s ease; }
.sz-fim h2 { font-family:var(--fonte-titulo); text-transform:uppercase; letter-spacing:1px; font-size:2rem; margin:0; }
.sz-fim.V { background:linear-gradient(135deg,#854d0e,#16a34a); } .sz-fim.D { background:linear-gradient(135deg,#1f2937,#7f1d1d); }
.sz-tab { width:100%; border-collapse:collapse; font-size:.9rem; } .sz-tab th { font-family:var(--fonte-mono); font-size:.7rem; color:#6b7280; text-align:center; padding:6px 3px; }
.sz-tab td { padding:7px 3px; text-align:center; border-top:1px solid #f1f3f5; } .sz-tab td.t { text-align:left; font-weight:600; } .sz-tab tr.eu { background:#fefce8; } .sz-tab tr.top td:first-child { border-left:4px solid #16a34a; }
</style>
